# @file: .github/workflows/deploy.yml
# @author: ForUltraplayer
# @brief: main 푸시 시 단위 테스트 후 Astro 사이트를 GitHub Pages에 배포

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install and test
        run: npm ci && npm test
      # CI=true 는 Actions가 자동 설정한다. Release 조회·프로필 이미지 실패 시 빌드가 실패한다.
      - name: Build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
